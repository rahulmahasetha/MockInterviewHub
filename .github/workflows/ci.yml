name: CI Pipeline (Frontend & Backend)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # BACKEND CI JOB: Lint, Unit Tests, Coverage, and E2E Pytest Validation
  # ============================================================================
  backend-ci:
    name: Backend CI (Node.js & Python Tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies (clean install)
        run: npm ci

      - name: Syntax & Lint Validation
        run: |
          echo "Validating JavaScript syntax across backend modules..."
          node --check server.js
          for f in $(find routes controllers models middleware utils -name '*.js'); do
            node --check "$f"
          done
          echo "All backend JavaScript files passed syntax verification."

      - name: Run Backend Unit & Route Tests (with Coverage)
        env:
          CI: true
          NODE_ENV: test
          PORT: 3001
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_for_ci
          GEMINI_API_KEY: ''
          GROQ_API_KEY: ''
        run: npm run test:coverage

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Python 3.11 for E2E Black-Box API Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Background Server for API Smoke Tests
        env:
          PORT: 3001
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_minimum_32_characters_for_ci
        run: |
          node server.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Wait for server health endpoint to respond
          echo "Waiting for backend server to become ready on port 3001..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:3001/health | grep -q "healthy"; then
              echo "Server is healthy and ready on port 3001."
              break
            fi
            sleep 1
          done

      - name: Run Pytest Integration Suite
        env:
          API_BASE_URL: http://127.0.0.1:3001
        run: pytest tests_pytest -v

      - name: Teardown Background Server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

  # ============================================================================
  # FRONTEND CI JOB: Test Execution, Coverage, and Production Build
  # ============================================================================
  frontend-ci:
    name: Frontend CI (React Tests & Production Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies (clean install)
        run: npm ci

      - name: Run React Component & Context Tests (with Coverage)
        env:
          CI: true
        run: npm run test:coverage

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build React Production Bundle
        env:
          CI: false
          REACT_APP_API_URL: https://api.mockinterviewhub.com
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          if [ ! -f "build/index.html" ]; then
            echo "Error: build/index.html does not exist! Build failed."
            exit 1
          fi
          echo "Production build verified successfully. Bundle contents:"
          ls -la build/

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: frontend/build/
          retention-days: 7
