name: CD Pipeline (Production Deployment)

on:
  workflow_run:
    workflows: ["CI Pipeline (Frontend & Backend)"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ============================================================================
  # BACKEND DEPLOYMENT: Render / Railway Webhook + Health Check Probe
  # ============================================================================
  deploy-backend:
    name: Deploy Backend Service
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend Deployment
        id: trigger_backend
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}" ]; then
            echo "🚀 Triggering Render backend deployment via secure deploy hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered (HTTP $HTTP_STATUS)."
            else
              echo "❌ Render deploy hook returned HTTP $HTTP_STATUS."
              exit 1
            fi
          elif [ -n "${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL }}" ]; then
            echo "🚀 Triggering custom backend deploy webhook..."
            curl -fsS -X POST "${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL }}"
          else
            echo "ℹ️ Note: No backend deploy secret configured (RENDER_BACKEND_DEPLOY_HOOK_URL or BACKEND_DEPLOY_WEBHOOK_URL)."
            echo "ℹ️ To automate backend deployment, add your hosting provider's Deploy Hook URL in GitHub Secrets."
          fi

      - name: Verify Backend Health Probe
        run: |
          if [ -z "${{ secrets.BACKEND_PRODUCTION_URL }}" ]; then
            echo "ℹ️ Note: BACKEND_PRODUCTION_URL secret is not configured; skipping remote health probe."
            exit 0
          fi
          echo "🔍 Probing backend health check at ${{ secrets.BACKEND_PRODUCTION_URL }}/health..."
          ATTEMPTS=0
          MAX_ATTEMPTS=15
          HEALTHY=false

          until [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; do
            RESPONSE=$(curl -s --max-time 10 "${{ secrets.BACKEND_PRODUCTION_URL }}/health" || echo "")
            if echo "$RESPONSE" | grep -q "healthy"; then
              echo "✅ Backend probe successful: $RESPONSE"
              HEALTHY=true
              break
            fi
            ATTEMPTS=$((ATTEMPTS+1))
            echo "⏳ Attempt $ATTEMPTS/$MAX_ATTEMPTS: Backend not ready yet. Retrying in 10s..."
            sleep 10
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Deployment verification failed! /health did not respond with healthy status within timeout."
            echo "⚠️ Action required: Check hosting logs and consider rolling back to previous deployment."
            exit 1
          fi

  # ============================================================================
  # FRONTEND DEPLOYMENT: Vercel Production Deployment + Site Probe
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend Application
    needs: [deploy-backend]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Frontend to Vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "🚀 Deploying frontend to Vercel via Vercel CLI..."
            npx --yes vercel --token "${{ secrets.VERCEL_TOKEN }}" --prod --yes ./frontend
          elif [ -n "${{ secrets.VERCEL_FRONTEND_DEPLOY_HOOK_URL }}" ]; then
            echo "🚀 Triggering Vercel deployment via Deploy Hook..."
            curl -fsS -X POST "${{ secrets.VERCEL_FRONTEND_DEPLOY_HOOK_URL }}"
          else
            echo "ℹ️ Note: No Vercel deploy secret configured (VERCEL_TOKEN or VERCEL_FRONTEND_DEPLOY_HOOK_URL)."
            echo "ℹ️ To automate frontend deployment, add your Vercel Token or Deploy Hook URL in GitHub Secrets."
          fi

      - name: Verify Frontend Availability
        run: |
          if [ -z "${{ secrets.FRONTEND_PRODUCTION_URL }}" ]; then
            echo "ℹ️ Note: FRONTEND_PRODUCTION_URL secret is not configured; skipping remote site probe."
            exit 0
          fi
          echo "🔍 Probing frontend production URL: ${{ secrets.FRONTEND_PRODUCTION_URL }}..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "${{ secrets.FRONTEND_PRODUCTION_URL }}")
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "✅ Frontend is reachable and returning HTTP $STATUS_CODE."
          else
            echo "❌ Frontend returned unexpected HTTP status: $STATUS_CODE"
            exit 1
          fi
